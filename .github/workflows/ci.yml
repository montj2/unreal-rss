name: CI/CD Pipeline

# Trigger on: PR, push to main, manual trigger
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust backend checks
  rust:
    name: Rust (cargo fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting (cargo fmt)
        run: |
          cd src-tauri
          cargo fmt --all -- --check
        if: always()

      - name: Lint with clippy
        run: |
          cd src-tauri
          cargo clippy --all-targets --all-features -- -D warnings
        if: always()

      - name: Run Rust tests
        run: |
          cd src-tauri
          cargo test --lib
        if: always()

  # TypeScript/React frontend checks
  typescript:
    name: TypeScript (ESLint, Prettier, type-check, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format -- --check
        if: always()

      - name: Lint with ESLint
        run: npm run lint
        if: always()

      - name: Type-check with TypeScript
        run: npm run type-check
        if: always()

      - name: Run React tests
        run: npm run test -- --coverage --watchAll=false
        if: always()

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
        if: always()

  # Tauri app build check
  tauri:
    name: Tauri App Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Tauri CLI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        if: always()

  # Documentation checks
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for broken doc links
        run: |
          echo "✓ Checking documentation structure..."
          # Verify key docs exist
          test -f docs/INDEX.md || (echo "❌ docs/INDEX.md missing" && exit 1)
          test -f docs/PROJECT-OVERVIEW.md || (echo "❌ docs/PROJECT-OVERVIEW.md missing" && exit 1)
          test -f .github/copilot-instructions.md || (echo "❌ .github/copilot-instructions.md missing" && exit 1)
          echo "✓ All critical docs present"

  # Summary check
  checks:
    name: All Checks
    runs-on: ubuntu-latest
    needs: [rust, typescript, tauri, docs]
    if: always()

    steps:
      - name: Check status
        run: |
          if [ "${{ needs.rust.result }}" != "success" ]; then
            echo "❌ Rust checks failed"
            exit 1
          fi
          if [ "${{ needs.typescript.result }}" != "success" ]; then
            echo "❌ TypeScript checks failed"
            exit 1
          fi
          if [ "${{ needs.tauri.result }}" != "success" ]; then
            echo "❌ Tauri build failed"
            exit 1
          fi
          if [ "${{ needs.docs.result }}" != "success" ]; then
            echo "❌ Documentation checks failed"
            exit 1
          fi
          echo "✅ All checks passed!"

  # Auto-comment on PR
  comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [checks]
    if: github.event_name == 'pull_request' && always()

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = ${{ needs.checks.result == 'success' }};
            const emoji = result ? '✅' : '❌';
            const status = result ? 'passed' : 'failed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} CI/CD checks ${status}`
            });
